plugins {
    id 'java'
    id 'application'    
    id("com.gradleup.shadow") version "9.6.1"
    id("net.nemerosa.versioning") version "4.0.1"
}

application {
    mainClass = "axs7sds.SampleDump"
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral() 
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
  }
  
dependencies {
    implementation ('edu.mines.jtk:edu-mines-jtk:1.1.0') {
      //excluding dependencies we don't need
      exclude group: "org.jogamp.jogl"
      exclude group: "org.jogamp.gluegen"
      exclude group: "com.googlecode.netlib-java"
    }
    testImplementation 'junit:junit:4.+'
    runtimeOnly 'com.formdev:flatlaf-intellij-themes:3.2.1'
}

jar {
    manifest {
        attributes(
                'Built-By'          : System.properties['user.name'],
                'Build-Timestamp'   : new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
                'Build-Commit'      : versioning.info.commit,
                'Build-FullVersion' : versioning.info.full,
                'Created-By'        : "Gradle ${gradle.gradleVersion}",
                'Build-Jdk'         : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-OS'          : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}",
                'Main-Class'        : "axs7sds.SampleDump"
        )
    }
}
// Transmits test sines to the sampler and receives them back. Needs the hardware and overwrites the sample slot:
// ./gradlew hardwareLoopback -Pdevice="XT [hw:0,0,0]" -Pslot=1 [-Prates=39555.4,48000] [-Pdebug=true]
tasks.register('hardwareLoopback', JavaExec) {
    group = 'verification'
    description = 'Transmits test samples to the sampler and receives them back (needs the hardware)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'axs7sds.HardwareLoopback'
    args = [project.findProperty('device') ?: 'XT', project.findProperty('slot') ?: '', project.findProperty('rates') ?: '']
    systemProperty 'debug', project.findProperty('debug') ?: 'false'
}
