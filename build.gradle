plugins {
    id 'java'
    id 'application'    
    id("com.github.johnrengelman.shadow") version "8.1.1"    
    id("net.nemerosa.versioning") version "3.1.0"
}

mainClassName = "axs7sds.SampleDump"

sourceCompatibility = 21
targetCompatibility = 21

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral() 
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
  }
  
dependencies {
    implementation ('edu.mines.jtk:edu-mines-jtk:1.1.0') {
      //excluding dependencies we don't need
      exclude group: "org.jogamp.jogl"
      exclude group: "org.jogamp.gluegen"
      exclude group: "com.googlecode.netlib-java"
    }
    testImplementation group: 'junit', name: 'junit', version: '4.+'
    runtimeOnly 'com.formdev:flatlaf-intellij-themes:3.2.1'
}

jar {
    manifest {
        attributes(
                'Built-By'          : System.properties['user.name'],
                'Build-Timestamp'   : new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
                'Build-Commit'      : versioning.info.commit,
                'Build-FullVersion' : versioning.info.full,
                'Created-By'        : "Gradle ${gradle.gradleVersion}",
                'Build-Jdk'         : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-OS'          : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}",
                'Main-Class'        : "axs7sds.SampleDump"
        )
    }
}